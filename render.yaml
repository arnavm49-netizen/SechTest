# ── Production ──
services:
  - type: web
    name: sechtest-psychometric-system
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:bootstrap && npm start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false

# ── Staging ──
  - type: web
    name: sechtest-staging
    runtime: node
    plan: free
    region: oregon
    branch: staging
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:bootstrap && npm start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: staging
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sechtest-staging-db
          property: connectionString

databases:
  - name: sechtest-staging-db
    plan: free
    region: oregon
    databaseName: psychometrics_staging
    user: sechtest_staging
